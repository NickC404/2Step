name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: lts/*
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Cache Playwright browsers
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-playwright-

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Build project
      run: npm run build

    - name: Verify build output
      run: |
        if [ -d "dist" ]; then
          echo "✅ dist folder created"
          ls -la dist/
          echo ""
          echo "Checking required files..."
          test -f dist/manifest.json && echo "✅ manifest.json" || echo "❌ manifest.json missing"
          test -f dist/background.js && echo "✅ background.js" || echo "❌ background.js missing"
          test -d dist/popup && echo "✅ popup folder" || echo "❌ popup folder missing"
          test -d dist/2fa.directory && echo "✅ 2fa.directory folder" || echo "❌ 2fa.directory folder missing"
          test -d dist/faq && echo "✅ faq folder" || echo "❌ faq folder missing"
        else
          echo "❌ dist folder not created by build"
          exit 1
        fi

    - name: Run Playwright tests
      run: dbus-run-session -- xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" npm test

    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30