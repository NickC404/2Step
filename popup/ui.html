<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2Step - 2FA Checker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="app" v-cloak>
        <!-- Header -->
        <header style="background-color: #4257AC">
            <div class="tabs">
                <button v-for="tab in tabs" :key="tab" :class="{ active: currentTab === tab }"
                    @click="currentTab = tab">
                    {{ tab }}
                </button>
            </div>
        </header>
        <!-- Main Content -->
        <main>
            <div v-if="currentTab === 'allSites'">

            </div>
            <div v-else="currentTab === 'currentSite'">

            </div>
        </main>
    </div>
    <script src="ui-logic.js" type="module"></script>
</body>

</html>
